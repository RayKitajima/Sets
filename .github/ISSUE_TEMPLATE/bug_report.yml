name: Bug report
description: Report a problem in one of the Set apps
labels: ["bug"]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - FolderSet
        - TerminalSet
        - EditorSet
        - BrowserSet
        - SetCenter
        - Disk image / installation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the app's About window.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what you expected
      description: Leave out anything private (paths, host names, page contents) from screenshots and logs.
    validations:
      required: true
